# Blueprint opcional: en Render, "New" → "Blueprint" y conecta este repositorio.
# También puedes crear un Web Service manual y usar el mismo startCommand que el Procfile.
services:
  - type: web
    name: xml-commerce
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /
