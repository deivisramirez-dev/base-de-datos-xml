{% extends "layout.html" %}
{% block title %}Clientes{% endblock %}
{% block content %}
<h2>Clientes</h2>
<table>
    <tr><th>ID</th><th>Nombre completo</th><th>Email</th></tr>
    {% for customer in customers %}
    <tr>
        <td>{{ customer.id }}</td>
        <td>{{ customer.full_name }}</td>
        <td>{{ customer.email }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
