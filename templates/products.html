{% extends "layout.html" %}
{% block title %}Productos{% endblock %}
{% block content %}
<h2>Productos</h2>
<table>
    <tr><th>ID</th><th>Producto</th><th>Precio unitario</th><th>Detalles</th></tr>
    {% for product in products %}
    <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.unit_price }}</td>
        <td>{{ product.details }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
